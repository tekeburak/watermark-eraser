[project]
name = "watermark-eraser"
version = "0.1.0"
description = "Erase AI provenance marks — invisible Unicode, C2PA/EXIF/XMP metadata, statistical text watermarks — from content you own"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Runtime is stdlib-only by design: git clone and run, nothing to install.
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
